name: Bootstrap tested source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.part.03'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize tested LEAFBOUND source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* | base64 --decode > /tmp/leafbound-source.zip
          unzip -o -q /tmp/leafbound-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish tested LEAFBOUND vertical slice'
          git push
