name: Browser smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check citadel.js

      - name: Install browser
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Exercise the six-card cycle
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/citadel-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'SCRIPT'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const hand = page.locator('#hand .tarot-card');
            if (await hand.count() !== 4) throw new Error('The reading must deal a four-card hand.');
            if (await page.locator('#deckCount').innerText() !== '2') throw new Error('The first deal should leave two cards in deck.');

            await hand.nth(0).click();
            await hand.nth(1).click();
            if (await page.locator('#hand .tarot-card.selected').count() !== 2) throw new Error('Both selections should preserve their order.');
            if (await page.locator('#combineButton').isDisabled()) throw new Error('Combine should be available after two selections.');

            await page.locator('#combineButton').click();
            await page.waitForTimeout(700);
            if (await page.locator('#discardCount').innerText() !== '2') throw new Error('The combined cards should enter discard.');
            if (await page.locator('#hand .tarot-card').count() !== 4) throw new Error('The hand should refill after a combination.');

            await hand.nth(0).click();
            await hand.nth(1).click();
            await page.locator('#combineButton').click();
            await page.waitForTimeout(700);
            if (await page.locator('#cycleCount').innerText() !== 'II') throw new Error('Discard should become the next deck when exhausted.');
            if (await page.locator('#discardCount').innerText() !== '0') throw new Error('The reshuffle should clear discard.');
            if (await page.locator('#deckCount').innerText() !== '2') throw new Error('The new deck should retain undealt cards.');
            if (errors.length) throw new Error(errors.join('\n'));

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          SCRIPT
