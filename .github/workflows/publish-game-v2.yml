name: Publish LEAFBOUND Living Tarot engine

on:
  push:
    branches: [main]
    paths:
      - '.v2/complete'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble tested engine
        shell: bash
        run: |
          set -euo pipefail
          cat .v2/game-*.txt > game.js
          rm -rf .v2
          rm -f .github/workflows/publish-game-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Living Tarot color-physics engine'
          git push
