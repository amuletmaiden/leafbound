<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071517">
  <title>Citadel Seafoam</title>
  <link rel="manifest" href="manifest.json?v=20260726-ritual">
  <link rel="icon" href="icon.svg?v=20260726-ritual" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260726-ritual">
  <link rel="stylesheet" href="refine.css?v=20260726-ritual">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <header>
    <button id="resetButton" class="brand" aria-label="Reset the reading"><i>✦</i>CITADEL SEAFOAM</button>
    <div class="counts"><span id="discoveryCount">0</span><i>/ 30</i><span id="cycleCount">I</span></div>
  </header>
  <main>
    <section id="stage" class="stage" aria-live="polite">
      <div class="stage-rings" aria-hidden="true"></div>
      <div id="stageCards" class="stage-cards"></div>
      <h1 id="compoundName">TAKE TWO</h1>
    </section>
    <section class="table" aria-label="The six relics">
      <div class="pile-wrap"><div id="deckPile" class="pile deck" aria-label="Deck"></div><span id="deckCount">2</span></div>
      <div id="hand" class="hand" role="list" aria-label="Cards in hand"></div>
      <div class="pile-wrap"><div id="discardPile" class="pile discard empty" aria-label="Discard pile"></div><span id="discardCount">0</span></div>
    </section>
    <nav class="controls" aria-label="Ritual controls"><button id="clearButton" aria-label="Clear selection" disabled>⌫</button><button id="combineButton" aria-label="Combine selected cards" disabled>↗</button></nav>
    <p class="keys"><b>1–4</b> SELECT &nbsp; <b>SPACE</b> COMBINE &nbsp; <b>ESC</b> CLEAR</p>
  </main>
  <script src="citadel.js?v=20260726-ritual"></script>
  <script src="textures.js?v=20260726-living-material"></script>
</body>
</html>
